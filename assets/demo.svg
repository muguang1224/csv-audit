<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="csv-audit — profile a CSV and report data-quality problems terminal demo">
  <rect width="1280" height="440" rx="14" fill="#0b0f14"/>
  <rect width="1280" height="440" rx="14" fill="none" stroke="#30363d"/>
  <line x1="0" y1="42" x2="1280" y2="42" stroke="#30363d"/>
  <circle cx="26" cy="21" r="7" fill="#ff5f56"/>
  <circle cx="50" cy="21" r="7" fill="#ffbd2e"/>
  <circle cx="74" cy="21" r="7" fill="#27c93f"/>
  <text x="640" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#8b949e">csv-audit</text>
  <g font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16">
    <text x="34" y="78" fill="#d2a8ff">$ </text><text x="53" y="78" fill="#c9d1d9">python3 scripts/csv_audit.py people.csv --fail-on medium</text><text x="34" y="104" fill="#f0f6fc" font-weight="700"># csv-audit report</text><text x="34" y="130" fill="#c9d1d9">**6 rows x 6 columns** - 5 finding(s): 1 high, 1 medium, 2 low, 1 info</text><text x="34" y="182" fill="#8b949e">#   column    type    missing  unique</text><text x="34" y="208" fill="#8b949e">3   joined    date    1 (17%)  5</text><text x="34" y="234" fill="#8b949e">4   country   string  0 (0%)   3</text><text x="34" y="286" fill="#a371f7">## CSV011 [HIGH] row 14 has 5 fields, expected 6</text><text x="34" y="312" fill="#a371f7">## CSV009 [LOW] [joined]</text><text x="34" y="338" fill="#c9d1d9">dates are written in 2 different formats (YYYY-MM-DD, DD/MM/YYYY)</text><text x="34" y="390" fill="#f85149">exit 1</text><text x="91" y="390" fill="#8b949e"> - gate failed on: high</text><text x="34" y="416" fill="#8b949e">The import broke because one row had the wrong shape.</text>
  </g>
</svg>
